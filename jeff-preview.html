<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390px, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Coach Jeff — Conversation v14</title>
<link rel="stylesheet" href="https://use.typekit.net/yhk4jya.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button{border:none;cursor:pointer;font-family:inherit;background:none}

:root{
  --white:#f4f0e8;--white-dim:rgba(244,240,232,0.52);--brass:#c9a875;
  --font-cmp:"freight-big-pro","freight-display-pro",serif;
  --font-disp:"freight-display-pro","Playfair Display",serif;
  --font-ui:"proxima-nova","Inter",system-ui,sans-serif;
}

/* ── MODE TOKENS ── */
.m-zero-dark{
  --bg-start:#020a04;--bg-end:#060f08;
  --accent:#4ecf6a;--ar:78;--ag:207;--ab:106;
  --glass-bg:rgba(2,12,4,0.55);--glass-tint:rgba(78,207,106,0.04);
}
.m-first-light{
  --bg-start:#09090e;--bg-end:#160d05;
  --accent:#E07828;--ar:224;--ag:120;--ab:40;
  --glass-bg:rgba(18,10,3,0.50);--glass-tint:rgba(224,120,40,0.07);
}
.m-steel-blue{
  --bg-start:#020810;--bg-end:#050e1c;
  --accent:#4A9EE0;--ar:74;--ag:158;--ab:224;
  --glass-bg:rgba(2,8,22,0.55);--glass-tint:rgba(74,158,224,0.06);
}
.m-ghost{
  --bg-start:#080808;--bg-end:#101010;
  --accent:#B8B8B8;--ar:184;--ag:184;--ab:184;
  --glass-bg:rgba(10,10,10,0.55);--glass-tint:rgba(184,184,184,0.04);
}

body{background:#010204;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 0}
.phone{
  width:390px;height:844px;border-radius:50px;overflow:hidden;position:relative;
  box-shadow:0 0 0 1px rgba(255,255,255,0.05),0 0 0 10px rgba(0,0,0,0.84),
    0 0 0 11px rgba(255,255,255,0.03),0 60px 160px rgba(0,0,0,0.95);
}
.screen{
  width:100%;height:100%;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:linear-gradient(185deg,var(--bg-start) 0%,var(--bg-end) 100%);
  transition:background 1.8s ease;
}

/* ── BACKGROUND LAYERS ── */
.bg-camo{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background-image:
    repeating-linear-gradient(112deg,rgba(184,160,122,.88) 0px,rgba(184,160,122,.88) 20px,rgba(74,92,53,.92) 20px,rgba(74,92,53,.92) 46px,rgba(92,69,48,.88) 46px,rgba(92,69,48,.88) 64px,transparent 64px,transparent 84px,rgba(74,92,53,.88) 84px,rgba(74,92,53,.88) 110px),
    repeating-linear-gradient(22deg,rgba(92,69,48,.82) 0px,rgba(92,69,48,.82) 26px,transparent 26px,transparent 52px,rgba(74,92,53,.88) 52px,rgba(74,92,53,.88) 76px,rgba(184,160,122,.78) 76px,rgba(184,160,122,.78) 98px,transparent 98px,transparent 124px);
  background-size:480px 480px;opacity:.13;mix-blend-mode:overlay;
}
.bg-fabric{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.05) 0px,transparent 1px,transparent 2px,rgba(0,0,0,.05) 3px),repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0px,transparent 1px,transparent 2px,rgba(0,0,0,.05) 3px);
  opacity:.45;mix-blend-mode:multiply;
}

/* Terrain canvas — static topographic contour lines */
#terrainC{position:absolute;top:0;left:0;z-index:2;pointer-events:none;opacity:0.7}

/* Particle field canvas */
#particleField{position:absolute;top:0;left:0;z-index:3;pointer-events:none}

/* Radio waves canvas — full screen, behind messages */
#radioWaveC{position:absolute;top:0;left:0;z-index:8;pointer-events:none}

/* Stars — Zero Dark only */
.bg-stars{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
.m-zero-dark .bg-stars{opacity:1}
.star-dot{position:absolute;border-radius:50%;background:#f4f0e8;animation:twinkle var(--tdur,3s) var(--tdelay,0s) ease-in-out infinite alternate}
@keyframes twinkle{0%{opacity:var(--tmin,.1);transform:scale(.85)}100%{opacity:var(--tmax,.6);transform:scale(1.1)}}

/* Aurora — First Light */
.bg-aurora{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
.m-first-light .bg-aurora{opacity:1}
.aurora-band{position:absolute;left:-20%;width:140%;border-radius:50%;filter:blur(55px);animation:aurora-drift var(--adur,14s) var(--adel,0s) ease-in-out infinite alternate}
@keyframes aurora-drift{0%{transform:translateX(-8%) scaleY(1);opacity:var(--ao,.12)}50%{transform:translateX(5%) scaleY(1.4);opacity:calc(var(--ao,.12)*1.8)}100%{transform:translateX(-3%) scaleY(.9);opacity:var(--ao,.12)}}

/* Steel Blue — subtle deep sea shimmer */
.bg-steel{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
.m-steel-blue .bg-steel{opacity:1}
.steel-wave{position:absolute;left:0;right:0;border-radius:50%;filter:blur(80px);animation:steel-shift var(--sdur,18s) var(--sdel,0s) ease-in-out infinite alternate}
@keyframes steel-shift{0%{transform:translateY(0);opacity:var(--so,.07)}50%{transform:translateY(-15px);opacity:calc(var(--so)*2.2)}100%{transform:translateY(5px);opacity:var(--so,.07)}}

/* Ghost — monochrome slow breathe */
.bg-ghost{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
.m-ghost .bg-ghost{opacity:1}
.ghost-veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,rgba(200,200,200,0.04) 0%,transparent 65%);animation:ghost-breathe 7s ease-in-out infinite alternate}
@keyframes ghost-breathe{0%{opacity:.5}100%{opacity:1}}

.bg-scanlines{position:absolute;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0px,transparent 3px,rgba(0,0,0,0.04) 3px,rgba(0,0,0,0.04) 4px);opacity:0;transition:opacity 1.4s ease}
.m-zero-dark .bg-scanlines{opacity:1}
.m-ghost .bg-scanlines{opacity:.6}
.crt-sweep{position:absolute;left:0;right:0;height:140px;background:linear-gradient(180deg,transparent,rgba(244,240,232,0.03) 50%,transparent);animation:crt-scan 7s linear infinite;pointer-events:none;z-index:6;opacity:0;transition:opacity 1.4s ease}
.m-zero-dark .crt-sweep{opacity:1}
@keyframes crt-scan{0%{top:-140px}100%{top:100%}}

.screen-vignette{position:absolute;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,0.62) 100%);animation:vignette-breath 5.5s ease-in-out infinite}
@keyframes vignette-breath{0%,100%{opacity:.75}50%{opacity:.48}}

/* Jeff glow pool */
.jeff-glow-pool{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:300px;height:300px;border-radius:50%;pointer-events:none;z-index:6;
  background:radial-gradient(ellipse at 50% 50%,rgba(var(--ar),var(--ag),var(--ab),.13) 0%,transparent 70%);
  animation:pool-breathe 5s ease-in-out infinite;
  transition:background 1.6s ease;
}
@keyframes pool-breathe{0%,100%{opacity:.7;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.08)}}
.state-speaking .jeff-glow-pool{animation:pool-speak 1.0s ease-in-out infinite}
@keyframes pool-speak{0%,100%{opacity:.8;transform:translateX(-50%) scale(1)}50%{opacity:1;transform:translateX(-50%) scale(1.18)}}

.nvg-wash{position:absolute;inset:0;z-index:7;pointer-events:none;background:rgba(0,38,8,0.18);opacity:0;transition:opacity 1.8s ease;mix-blend-mode:color}
.m-zero-dark .nvg-wash{opacity:1}

.mode-flash{position:absolute;inset:0;z-index:90;pointer-events:none;background:rgba(var(--ar),var(--ag),var(--ab),.08);opacity:0;transition:opacity .08s ease}
.mode-flash.on{opacity:1}

/* RWB */
.rwb-stripe{position:absolute;top:0;left:0;right:0;z-index:9999;height:4px;background:linear-gradient(90deg,#B22234 0%,#B22234 33.3%,#f4f0e8 33.3%,#f4f0e8 66.6%,#3C3B6E 66.6%,#3C3B6E 100%);opacity:0.72;animation:rwbShimmer 4s ease-in-out infinite}
.rwb-stripe-bottom{position:absolute;bottom:0;left:0;right:0;z-index:9999;height:4px;background:linear-gradient(90deg,#B22234 0%,#B22234 33.3%,#f4f0e8 33.3%,#f4f0e8 66.6%,#3C3B6E 66.6%,#3C3B6E 100%);opacity:0.72;animation:rwbShimmer 4s ease-in-out infinite}
@keyframes rwbShimmer{0%,100%{opacity:0.72}50%{opacity:0.90}}

/* STATUS BAR — no clock, just clean space */
.status-bar{height:44px;display:flex;align-items:flex-end;padding:0 28px 8px;justify-content:flex-start;position:relative;z-index:20;flex-shrink:0}

/* HEADER */
.hdr{position:relative;z-index:20;padding:0 20px 8px;flex-shrink:0}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between}
.hdr-spacer{width:36px;flex-shrink:0}
.hdr-center{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:2px}
.hdr-title{
  font:800 28px/1 var(--font-cmp);letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);
  text-shadow:0 0 28px rgba(var(--ar),var(--ag),var(--ab),.70),0 0 55px rgba(var(--ar),var(--ag),var(--ab),.30),0 1px 0 rgba(0,0,0,0.8);
  transition:color 1.6s ease,text-shadow 1.6s ease;
  white-space:nowrap;
  position:relative;overflow:hidden;
}
/* Glint — light sweeping a military nameplate */
.hdr-title::after{
  content:'';
  position:absolute;top:-10%;left:-110%;
  width:55%;height:120%;
  background:linear-gradient(
    105deg,
    transparent 30%,
    rgba(255,255,255,0.10) 42%,
    rgba(255,255,255,0.30) 50%,
    rgba(255,255,255,0.10) 58%,
    transparent 70%
  );
  animation:title-glint 9s ease-in-out infinite;
  pointer-events:none;
  transform:skewX(-15deg);
}
@keyframes title-glint{
  0%,78%{left:-110%;opacity:0}
  79%{opacity:1}
  88%{left:140%;opacity:1}
  89%,100%{left:140%;opacity:0}
}
.hdr-status{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:5px}
/* Status dot — always green, Jeff is always on station */
.status-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:#4ecf6a;
  box-shadow:0 0 7px rgba(78,207,106,0.85),0 0 14px rgba(78,207,106,0.35);
  animation:dot-idle 2.6s ease-in-out infinite;
}
@keyframes dot-idle{0%,100%{opacity:0.52;transform:scale(0.82)}50%{opacity:1;transform:scale(1.18)}}
.state-listening .status-dot{animation:dot-fast 0.55s ease-in-out infinite}
@keyframes dot-fast{0%,100%{opacity:0.75;transform:scale(0.90)}50%{opacity:1;transform:scale(1.22)}}
.state-thinking .status-dot{background:#c8a03c;box-shadow:0 0 7px rgba(200,160,60,0.75);animation:dot-think 1.1s ease-in-out infinite}
@keyframes dot-think{0%,100%{opacity:0.45;transform:scale(0.80)}50%{opacity:1;transform:scale(1.10)}}
.state-speaking .status-dot{background:#4ecf6a;animation:dot-speak 0.42s ease-in-out infinite}
@keyframes dot-speak{0%,100%{opacity:0.65;transform:scale(0.88)}50%{opacity:1;transform:scale(1.25)}}
.status-text{
  font:800 9px/1 var(--font-ui);letter-spacing:.24em;text-transform:uppercase;
  color:#4ecf6a;opacity:0.88;
}
.hdr-right{display:flex;align-items:flex-start;gap:10px;padding-top:2px}
.mode-row{display:flex;gap:5px;margin-top:8px}
.mbtn{
  flex:1;padding:6px 0;border-radius:20px;
  /* Liquid glass base */
  background:rgba(255,255,255,0.055);
  backdrop-filter:blur(22px) saturate(160%) brightness(1.08);
  -webkit-backdrop-filter:blur(22px) saturate(160%) brightness(1.08);
  border:1px solid rgba(255,255,255,0.10);
  /* 3D depth stack */
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.18),
    inset 0 -1px 0 rgba(0,0,0,0.22),
    0 2px 10px rgba(0,0,0,0.22),
    0 1px 3px rgba(0,0,0,0.14);
  font:700 7px/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;
  color:rgba(244,240,232,.32);
  transition:all .4s ease;text-align:center;
  position:relative;overflow:hidden;
}
/* Top-edge specular — light hitting the rim */
.mbtn::before{
  content:'';position:absolute;top:0;left:8%;right:8%;height:45%;
  background:linear-gradient(180deg,rgba(255,255,255,0.16) 0%,rgba(255,255,255,0.04) 60%,transparent 100%);
  border-radius:20px 20px 50% 50%;pointer-events:none;z-index:1;
}
/* Bottom edge catch-light */
.mbtn::after{
  content:'';position:absolute;bottom:0;left:15%;right:15%;height:1px;
  background:rgba(255,255,255,0.06);pointer-events:none;z-index:1;
}
/* ACTIVE — colored liquid glass, mode-tinted */
.mbtn.on{
  background:rgba(var(--ar),var(--ag),var(--ab),0.16);
  backdrop-filter:blur(28px) saturate(210%) brightness(1.14);
  -webkit-backdrop-filter:blur(28px) saturate(210%) brightness(1.14);
  border-color:rgba(var(--ar),var(--ag),var(--ab),0.52);
  color:var(--accent);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.28),
    inset 0 -1px 0 rgba(0,0,0,0.20),
    0 0 0 1px rgba(var(--ar),var(--ag),var(--ab),0.08),
    0 0 16px rgba(var(--ar),var(--ag),var(--ab),0.22),
    0 4px 14px rgba(0,0,0,0.28);
}
/* Active top sheen — mode-colored light */
.mbtn.on::before{
  background:linear-gradient(180deg,
    rgba(var(--ar),var(--ag),var(--ab),0.24) 0%,
    rgba(var(--ar),var(--ag),var(--ab),0.06) 55%,
    transparent 100%);
}

/* HAMBURGER */
.ham-btn{
  width:38px;height:38px;border-radius:12px;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(24px) saturate(170%) brightness(1.10);
  -webkit-backdrop-filter:blur(24px) saturate(170%) brightness(1.10);
  border:1px solid rgba(255,255,255,0.13);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.24),
    inset 0 -1.5px 0 rgba(0,0,0,0.22),
    inset 1px 0 0 rgba(255,255,255,0.06),
    0 4px 16px rgba(0,0,0,0.30),
    0 1px 4px rgba(0,0,0,0.16);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;transition:all .25s ease;flex-shrink:0;position:relative;overflow:hidden;
}
/* Top-edge glass shine */
.ham-btn::before{
  content:'';position:absolute;top:0;left:8%;right:8%;height:42%;
  background:linear-gradient(180deg,rgba(255,255,255,0.18) 0%,rgba(255,255,255,0.04) 65%,transparent 100%);
  border-radius:12px 12px 50% 50%;pointer-events:none;z-index:1;
}
.ham-btn:active{
  background:rgba(var(--ar),var(--ag),var(--ab),0.16);
  border-color:rgba(var(--ar),var(--ag),var(--ab),0.38);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.16),inset 0 -1px 0 rgba(0,0,0,0.28),0 2px 8px rgba(0,0,0,0.28);
}
.ham-line{width:15px;height:1.5px;border-radius:1px;background:rgba(244,240,232,.75);transition:background .2s;position:relative;z-index:2}
.ham-btn:hover .ham-line,.ham-btn:active .ham-line{background:var(--accent)}

/* SVG FILTER */
.svg-defs{position:absolute;width:0;height:0;overflow:hidden}

/* PORTRAIT ZONE */
.portrait-zone{
  position:relative;z-index:10;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 0 2px;flex-shrink:0;overflow:visible;
}
#memC{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateY(-8px);pointer-events:none;z-index:11}

.sonar-ring{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) translateY(-8px);
  border-radius:50%;border:1.5px solid rgba(var(--ar),var(--ag),var(--ab),0.40);
  pointer-events:none;z-index:9;transition:border-color 1.4s ease;
}
.sonar-ring.r1{width:200px;height:200px;animation:sonarPulse 3.4s ease-out 0s infinite}
.sonar-ring.r2{width:200px;height:200px;animation:sonarPulse 3.4s ease-out 1.13s infinite}
.sonar-ring.r3{width:200px;height:200px;animation:sonarPulse 3.4s ease-out 2.26s infinite}
@keyframes sonarPulse{
  0%{width:200px;height:200px;opacity:.65;border-width:2px}
  100%{width:330px;height:330px;opacity:0;border-width:1px}
}

/* Jeff face — breathes with scale + glow */
.jeff-face{
  position:relative;z-index:12;
  width:192px;height:192px;border-radius:50%;
  border:2px solid rgba(var(--ar),var(--ag),var(--ab),0.65);
  overflow:hidden;
  box-shadow:0 0 0 4px rgba(var(--ar),var(--ag),var(--ab),0.08),0 0 35px rgba(var(--ar),var(--ag),var(--ab),0.28),0 0 75px rgba(var(--ar),var(--ag),var(--ab),0.12),0 14px 44px rgba(0,0,0,0.65);
  transition:border-color 1.4s ease;
  animation:face-breathe 5s ease-in-out infinite;
}
@keyframes face-breathe{
  0%,100%{transform:scale(1.000);box-shadow:0 0 0 4px rgba(var(--ar),var(--ag),var(--ab),0.08),0 0 35px rgba(var(--ar),var(--ag),var(--ab),0.28),0 0 75px rgba(var(--ar),var(--ag),var(--ab),0.12),0 14px 44px rgba(0,0,0,0.65)}
  50%{transform:scale(1.018);box-shadow:0 0 0 7px rgba(var(--ar),var(--ag),var(--ab),0.14),0 0 55px rgba(var(--ar),var(--ag),var(--ab),0.46),0 0 110px rgba(var(--ar),var(--ag),var(--ab),0.22),0 14px 50px rgba(0,0,0,0.70)}
}
.state-speaking .jeff-face{animation:face-speak 1.0s ease-in-out infinite}
@keyframes face-speak{
  0%,100%{transform:scale(1.000);box-shadow:0 0 0 5px rgba(var(--ar),var(--ag),var(--ab),0.12),0 0 45px rgba(var(--ar),var(--ag),var(--ab),0.38),0 0 90px rgba(var(--ar),var(--ag),var(--ab),0.20),0 14px 44px rgba(0,0,0,0.65)}
  50%{transform:scale(1.020);box-shadow:0 0 0 10px rgba(var(--ar),var(--ag),var(--ab),0.20),0 0 70px rgba(var(--ar),var(--ag),var(--ab),0.60),0 0 130px rgba(var(--ar),var(--ag),var(--ab),0.30),0 14px 55px rgba(0,0,0,0.72)}
}
.jeff-face img{
  width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;
  /* Cinematic emergence — Jeff materializes from darkness, soft edge fade */
  mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,
    black 42%,
    rgba(0,0,0,0.88) 58%,
    rgba(0,0,0,0.55) 74%,
    rgba(0,0,0,0.18) 88%,
    transparent 100%
  );
  -webkit-mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,
    black 42%,
    rgba(0,0,0,0.88) 58%,
    rgba(0,0,0,0.55) 74%,
    rgba(0,0,0,0.18) 88%,
    transparent 100%
  );
}

.jeff-voice-ring{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%) translateY(-8px);
  border-radius:50%;pointer-events:none;z-index:15;
  border:2px solid rgba(var(--ar),var(--ag),var(--ab),0.65);
  animation:jeffVoiceRing 1.8s ease-out forwards;
}
@keyframes jeffVoiceRing{
  0%{width:196px;height:196px;opacity:.80;border-width:2.5px}
  100%{width:380px;height:380px;opacity:0;border-width:1px}
}

/* LIQUID GLASS */
.glass{
  position:relative;background:var(--glass-bg);
  backdrop-filter:blur(46px) saturate(175%) brightness(1.12);
  -webkit-backdrop-filter:blur(46px) saturate(175%) brightness(1.12);
  border-radius:18px;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.28),0 14px 50px rgba(0,0,0,.38);
  overflow:hidden;transition:background 1.6s ease;
}
.glass::before{
  content:'';position:absolute;inset:0;border-radius:18px;padding:1px;
  background:linear-gradient(145deg,rgba(255,255,255,.74) 0%,rgba(255,222,132,.38) 14%,rgba(var(--ar),var(--ag),var(--ab),.28) 30%,rgba(130,200,255,.16) 50%,transparent 72%,rgba(255,255,255,.12) 100%);
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:3;
}
.glass::after{
  content:'';position:absolute;inset:0;border-radius:18px;
  background-image:linear-gradient(112deg,rgba(184,160,122,.06) 0px,rgba(184,160,122,.06) 22px,rgba(74,92,53,.07) 22px,rgba(74,92,53,.07) 50px,rgba(92,69,48,.05) 50px,rgba(92,69,48,.05) 68px,transparent 68px);
  background-size:480px 480px;mix-blend-mode:overlay;pointer-events:none;z-index:0;
  box-shadow:inset 0 0 0 1000px var(--glass-tint);
}

/* MESSAGE SCROLL */
.msg-scroll{flex:1;overflow-y:auto;padding:8px 14px 10px;position:relative;z-index:10;scrollbar-width:none;min-height:0}
.msg-scroll::-webkit-scrollbar{display:none}
.msg-row{display:flex;margin-bottom:10px}
.jeff-msg{justify-content:flex-start}
.user-msg{justify-content:flex-end}
.msg-bubble{max-width:78%;padding:10px 14px;border-radius:16px;position:relative}
.jeff-bubble{background:rgba(var(--ar),var(--ag),var(--ab),0.09);border:1px solid rgba(var(--ar),var(--ag),var(--ab),0.22);border-radius:4px 16px 16px 16px}
.user-bubble{background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.14);border-radius:16px 4px 16px 16px}
.msg-text{font:400 14px/1.55 var(--font-ui);color:rgba(244,240,232,0.88)}
.msg-time{display:block;font:400 9px/1 var(--font-ui);color:rgba(244,240,232,0.28);margin-top:5px;letter-spacing:.04em}

/* Orb bloom pulse overlay */
.orb-bloom{position:absolute;inset:0;border-radius:50%;pointer-events:none;z-index:5;opacity:0;transition:opacity .6s ease;background:radial-gradient(ellipse at 50% 50%,rgba(var(--ar),var(--ag),var(--ab),.28) 0%,transparent 65%)}
.orb-bloom.active{opacity:1;transition:opacity 0s}

/* TALK ASSEMBLY */
.talk-assembly{
  position:relative;z-index:15;
  display:flex;flex-direction:column;align-items:center;
  padding:4px 0 14px;flex-shrink:0;
}
.talk-row{display:flex;align-items:center;gap:16px}

/* THE RESONANCE ORB */
.resonance-orb{
  position:relative;width:160px;height:160px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
}
.resonance-orb:active .orb-sphere{transform:scale(0.96)}
.orb-canvas{position:absolute;top:0;left:0;pointer-events:none;z-index:1}
.orb-sphere{
  position:relative;z-index:2;
  width:100px;height:100px;border-radius:50%;
  background:rgba(8,10,16,0.85);
  border:2px solid rgba(var(--ar),var(--ag),var(--ab),0.42);
  display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 2px 8px rgba(255,255,255,0.055),inset 0 -2px 8px rgba(0,0,0,0.5),0 0 0 5px rgba(var(--ar),var(--ag),var(--ab),0.05),0 10px 35px rgba(0,0,0,0.55);
  transition:border-color .4s ease,box-shadow .4s ease,transform .12s ease;
}
.state-listening .orb-sphere{
  border-color:rgba(80,210,100,0.72);
  box-shadow:inset 0 2px 8px rgba(80,210,100,0.07),inset 0 -2px 8px rgba(0,0,0,0.5),0 0 0 8px rgba(80,210,100,0.07),0 0 38px rgba(80,210,100,0.28),0 10px 35px rgba(0,0,0,0.55);
}
.state-thinking .orb-sphere{
  border-color:rgba(200,160,60,0.55);
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.5),0 0 20px rgba(200,160,60,0.18),0 10px 35px rgba(0,0,0,0.55);
}
.state-speaking .orb-sphere{
  border-color:rgba(var(--ar),var(--ag),var(--ab),0.80);
  box-shadow:inset 0 2px 8px rgba(var(--ar),var(--ag),var(--ab),0.08),inset 0 -2px 8px rgba(0,0,0,0.5),0 0 0 9px rgba(var(--ar),var(--ag),var(--ab),0.08),0 0 45px rgba(var(--ar),var(--ag),var(--ab),0.36),0 10px 35px rgba(0,0,0,0.55);
}
.orb-sphere::before{
  content:'';position:absolute;top:12%;left:20%;width:40%;height:28%;border-radius:50%;
  background:radial-gradient(ellipse at 40% 35%,rgba(255,255,255,0.18) 0%,transparent 70%);
  pointer-events:none;z-index:3;
}
.orb-mic{position:relative;z-index:4;transition:opacity .4s ease;display:flex;align-items:center;justify-content:center}
.state-listening .orb-mic,.state-thinking .orb-mic,.state-speaking .orb-mic{opacity:0}

/* Side action buttons */
.side-action{
  width:38px;height:38px;border-radius:50%;
  /* Liquid glass sphere */
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(24px) saturate(170%) brightness(1.10);
  -webkit-backdrop-filter:blur(24px) saturate(170%) brightness(1.10);
  border:1px solid rgba(255,255,255,0.14);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.26),
    inset 0 -1.5px 0 rgba(0,0,0,0.24),
    inset 1px 0 0 rgba(255,255,255,0.06),
    0 4px 16px rgba(0,0,0,0.32),
    0 1px 4px rgba(0,0,0,0.18);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .25s ease;flex-shrink:0;
  position:relative;overflow:hidden;
}
/* Specular dome highlight */
.side-action::before{
  content:'';position:absolute;top:8%;left:15%;width:62%;height:42%;
  background:radial-gradient(ellipse at 45% 20%,rgba(255,255,255,0.22) 0%,rgba(255,255,255,0.06) 55%,transparent 100%);
  pointer-events:none;z-index:1;border-radius:50%;
}
.side-action:active{
  background:rgba(var(--ar),var(--ag),var(--ab),0.18);
  border-color:rgba(var(--ar),var(--ag),var(--ab),0.40);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.18),inset 0 -1px 0 rgba(0,0,0,0.28),0 2px 8px rgba(0,0,0,0.28);
}
.side-action svg{display:block;transition:stroke .2s;position:relative;z-index:2}
.mute-btn.muted{
  background:rgba(160,30,30,0.22);border-color:rgba(200,60,60,0.42);
  box-shadow:inset 0 1.5px 0 rgba(255,180,180,0.14),inset 0 -1.5px 0 rgba(0,0,0,0.24),0 0 16px rgba(200,40,40,0.18),0 4px 14px rgba(0,0,0,0.30);
}
.mute-btn.muted svg{stroke:rgba(210,85,85,0.95) !important}
.kbd-btn.active-txt{
  background:rgba(var(--ar),var(--ag),var(--ab),0.16);border-color:rgba(var(--ar),var(--ag),var(--ab),0.44);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,0.22),inset 0 -1.5px 0 rgba(0,0,0,0.20),0 0 14px rgba(var(--ar),var(--ag),var(--ab),0.20),0 4px 14px rgba(0,0,0,0.28);
}

/* TALK LABEL */
.talk-label{
  display:block;margin-top:6px;
  font:700 9px/1 var(--font-ui);letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(var(--ar),var(--ag),var(--ab),.52);
  transition:color .4s ease;white-space:nowrap;
}
.state-listening .talk-label{color:rgba(80,210,100,.75)}
.state-thinking .talk-label{color:rgba(200,160,60,.65)}
.state-speaking .talk-label{color:rgba(var(--ar),var(--ag),var(--ab),.85)}

/* TEXT INPUT */
.text-input-row{
  display:none;align-items:center;gap:8px;
  width:340px;margin-top:8px;padding:8px 14px;border-radius:24px;
  background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);
}
.text-input-row.visible{display:flex}
.msg-input{flex:1;background:none;border:none;outline:none;font:400 14px/1 var(--font-ui);color:var(--white);caret-color:var(--accent)}
.msg-input::placeholder{color:rgba(244,240,232,.32)}
.send-btn{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:rgba(var(--ar),var(--ag),var(--ab),0.20);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(var(--ar),var(--ag),var(--ab),0.42);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,0.22),
    inset 0 -1px 0 rgba(0,0,0,0.20),
    0 0 14px rgba(var(--ar),var(--ag),var(--ab),0.22),
    0 3px 10px rgba(0,0,0,0.28);
  color:var(--accent);font-size:16px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:all .2s ease;position:relative;overflow:hidden;
}
.send-btn::before{
  content:'';position:absolute;top:6%;left:12%;width:65%;height:42%;
  background:radial-gradient(ellipse at 45% 20%,rgba(255,255,255,0.20) 0%,transparent 70%);
  pointer-events:none;
}
.send-btn:active{transform:scale(0.93);box-shadow:inset 0 1px 0 rgba(255,255,255,0.14),0 1px 5px rgba(0,0,0,0.28)}

/* HAMBURGER DRAWER */
.ham-overlay{position:absolute;inset:0;z-index:100;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .28s ease}
.ham-overlay.open{opacity:1;pointer-events:all}
.ham-drawer{
  position:absolute;top:0;left:0;bottom:0;width:285px;
  background:rgba(4,6,14,0.55);
  backdrop-filter:blur(52px) saturate(240%) brightness(1.10);
  -webkit-backdrop-filter:blur(52px) saturate(240%) brightness(1.10);
  border-right:1px solid rgba(255,255,255,.10);
  transform:translateX(-100%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;padding:0 0 32px;
  box-shadow:4px 0 60px rgba(0,0,0,.55),inset -1px 0 0 rgba(255,255,255,.06);
}
.ham-overlay.open .ham-drawer{transform:translateX(0)}
.ham-drawer-top{padding:52px 22px 24px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;text-align:center}
.ham-drawer-logo{font:700 22px/1 var(--font-cmp);letter-spacing:.10em;text-transform:uppercase;color:var(--white)}
.ham-drawer-sub{font:700 8px/1 var(--font-ui);letter-spacing:.22em;text-transform:uppercase;color:rgba(var(--ar),var(--ag),var(--ab),.7);margin-top:7px;transition:color 1.4s ease}
.ham-nav{flex:1;padding:12px 0;overflow-y:auto}
.ham-item{display:flex;align-items:center;gap:14px;padding:14px 22px;cursor:pointer;transition:background .15s;position:relative;--icr:244;--icg:240;--icb:232}
.ham-item:hover{background:rgba(var(--icr),var(--icg),var(--icb),0.07)}
.ham-item:hover::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;background:rgb(var(--icr),var(--icg),var(--icb));border-radius:0 2px 2px 0;box-shadow:0 0 8px rgba(var(--icr),var(--icg),var(--icb),0.55)}
.ham-item.active{background:rgba(var(--ar),var(--ag),var(--ab),.09)}
.ham-item.active::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:2.5px;background:var(--accent);border-radius:0 2px 2px 0;box-shadow:0 0 10px rgba(var(--ar),var(--ag),var(--ab),.6)}
.ham-ico{width:22px;height:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ham-ico svg{display:block;transition:stroke .2s}
.ham-item:not(.active) .ham-ico svg{stroke:rgba(244,240,232,.38);fill:none}
.ham-item.active .ham-ico svg{stroke:var(--accent);fill:none}
.ham-lbl{font:500 14px/1 var(--font-ui);color:rgba(244,240,232,.58);letter-spacing:.01em}
.ham-item:hover .ham-lbl{color:rgba(244,240,232,.85)}
.ham-item.active .ham-lbl{color:var(--white);font-weight:600}
.ham-divider{height:1px;background:rgba(255,255,255,.06);margin:8px 20px}
.ham-crisis-btn{margin:0 14px;padding:14px 16px;border-radius:16px;background:rgba(160,28,28,.18);border:1px solid rgba(200,55,55,.22);display:flex;align-items:center;gap:14px;cursor:pointer;transition:background .2s}
.ham-crisis-btn:hover{background:rgba(160,28,28,.28);border-color:rgba(200,55,55,.38)}
.ham-crisis-ico{width:26px;height:26px;flex-shrink:0}
.ham-crisis-ico svg{display:block;width:100%;height:100%}
.ham-crisis-label{display:block;font:700 11px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:rgba(230,90,90,.95)}
.ham-crisis-sub{display:block;font:400 9px/1.4 var(--font-ui);color:rgba(230,90,90,.45);margin-top:4px}

/* TYPING INDICATOR — Jeff is composing */
.typing-indicator{
  display:flex;align-items:center;gap:5px;
  padding:12px 16px;
  background:rgba(var(--ar),var(--ag),var(--ab),0.09);
  border:1px solid rgba(var(--ar),var(--ag),var(--ab),0.22);
  border-radius:4px 16px 16px 16px;
  width:62px;
  transition:background 1.4s ease,border-color 1.4s ease;
}
.typing-dot{
  width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:rgba(var(--ar),var(--ag),var(--ab),0.72);
  animation:typing-bounce 1.3s ease-in-out infinite;
  transition:background 1.4s ease;
}
.typing-dot:nth-child(2){animation-delay:.22s}
.typing-dot:nth-child(3){animation-delay:.44s}
@keyframes typing-bounce{
  0%,55%,100%{transform:translateY(0);opacity:0.38}
  28%{transform:translateY(-7px);opacity:1}
}
</style>
</head>

<script>
// ═══════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════
function getModeRGB() {
  var s = document.getElementById('screen');
  var st = getComputedStyle(s);
  var ar = parseInt(st.getPropertyValue('--ar').trim()) || 224;
  var ag = parseInt(st.getPropertyValue('--ag').trim()) || 120;
  var ab = parseInt(st.getPropertyValue('--ab').trim()) || 40;
  return [ar, ag, ab];
}
function escapeHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════
//  MODE SYSTEM
// ═══════════════════════════════════════════
var MODES = {
  'zero-dark':  {cls:'m-zero-dark'},
  'first-light':{cls:'m-first-light'},
  'steel-blue': {cls:'m-steel-blue'},
  'ghost':      {cls:'m-ghost'}
};
function autoMode() {
  var h = new Date().getHours();
  if (h>=21||h<5)  return 'zero-dark';
  if (h>=5&&h<9)   return 'first-light';
  if (h>=9&&h<17)  return 'steel-blue';
  return 'ghost';
}
function setMode(key, fromUser) {
  var m = MODES[key];
  if (!m) return;
  var s = document.getElementById('screen');
  if (fromUser) {
    var f = document.getElementById('modeFlash');
    f.classList.add('on');
    setTimeout(function(){ f.classList.remove('on'); }, 120);
  }
  s.classList.remove('m-zero-dark','m-first-light','m-steel-blue','m-ghost');
  s.classList.add(m.cls);
  document.querySelectorAll('.mbtn').forEach(function(b){ b.classList.toggle('on', b.dataset.m === key); });
}
setMode(autoMode());
document.querySelectorAll('.mbtn').forEach(function(btn){
  btn.addEventListener('click', function(){ setMode(btn.dataset.m, true); });
});

// ═══════════════════════════════════════════
//  TALK STATE MACHINE
// ═══════════════════════════════════════════
var talkState = 'idle';
var jeffRingTimer = null;
var jeffRings = [];
var isMuted = false;
var orbRotation = 0;
var textMode = false;
var radioWaveTimer = null;
var typingRowEl = null;

function showTypingIndicator() {
  removeTypingIndicator();
  var scroll = document.getElementById('msgScroll');
  if (!scroll) return;
  var row = document.createElement('div');
  row.className = 'msg-row jeff-msg';
  row.id = 'typingRow';
  row.innerHTML = '<div class="typing-indicator"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
  scroll.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
  typingRowEl = row;
}
function removeTypingIndicator() {
  var el = document.getElementById('typingRow');
  if (el) el.remove();
  typingRowEl = null;
}

function setTalkState(s) {
  talkState = s;
  var scr = document.getElementById('screen');
  var lbl = document.getElementById('talkLabel');
  scr.classList.remove('state-idle','state-listening','state-thinking','state-speaking');
  scr.classList.add('state-' + s);
  stopRadioWaves();
  if (s === 'listening') {
    if (lbl) lbl.textContent = 'LISTENING...';
    stopJeffVoiceRings();
    removeTypingIndicator();
    startRadioWaves('up');
  } else if (s === 'thinking') {
    if (lbl) lbl.textContent = 'THINKING...';
    stopJeffVoiceRings();
    showTypingIndicator();
  } else if (s === 'speaking') {
    if (lbl) lbl.textContent = 'JEFF IS SPEAKING';
    removeTypingIndicator();
    startJeffVoiceRings();
    startRadioWaves('down');
  } else {
    if (lbl) lbl.textContent = 'TALK';
    stopJeffVoiceRings();
    removeTypingIndicator();
  }
}

function handleTalk() {
  if (talkState === 'idle') {
    setTalkState('listening');
    setTimeout(function(){ if(talkState==='listening') setTalkState('thinking'); }, 3000);
    setTimeout(function(){ if(talkState==='thinking') setTalkState('speaking'); }, 4500);
    setTimeout(function(){ if(talkState==='speaking') setTalkState('idle'); }, 8500);
  } else {
    setTalkState('idle');
  }
}

function toggleMute() {
  isMuted = !isMuted;
  document.getElementById('muteBtn').classList.toggle('muted', isMuted);
}
function toggleTextMode() {
  textMode = !textMode;
  var row = document.getElementById('textInputRow');
  var btn = document.getElementById('kbdBtn');
  row.classList.toggle('visible', textMode);
  btn.classList.toggle('active-txt', textMode);
  if (textMode) setTimeout(function(){ document.getElementById('msgInput').focus(); }, 100);
}

function sendTextMessage() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text) return;
  var scroll = document.getElementById('msgScroll');
  var row = document.createElement('div');
  row.className = 'msg-row user-msg';
  row.innerHTML = '<div class="msg-bubble user-bubble"><p class="msg-text">' + escapeHtml(text) + '</p></div>';
  scroll.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
  input.value = '';
  setTalkState('thinking');
  setTimeout(function(){
    setTalkState('speaking');
    setTimeout(function(){
      setTalkState('idle');
      var jeffRow = document.createElement('div');
      jeffRow.className = 'msg-row jeff-msg';
      jeffRow.innerHTML = '<div class="msg-bubble glass jeff-bubble"><p class="msg-text">Heard you. Give me a second to think that through.</p></div>';
      scroll.appendChild(jeffRow);
      scroll.scrollTop = scroll.scrollHeight;
      triggerOrbBloom();
    }, 3500);
  }, 1500);
}
document.getElementById('msgInput').addEventListener('keydown', function(e){
  if (e.key === 'Enter') sendTextMessage();
});

// ═══════════════════════════════════════════
//  ORB BLOOM PULSE — fires when Jeff message arrives
// ═══════════════════════════════════════════
function triggerOrbBloom() {
  var bloom = document.getElementById('orbBloom');
  if (!bloom) return;
  bloom.classList.add('active');
  setTimeout(function(){ bloom.classList.remove('active'); }, 50);
}

// ═══════════════════════════════════════════
//  HAMBURGER
// ═══════════════════════════════════════════
function openMenu() { document.getElementById('hamOverlay').classList.add('open'); }
function closeMenu() { document.getElementById('hamOverlay').classList.remove('open'); }
function closeMenuOnOverlay(e) { if (e.target===document.getElementById('hamOverlay')) closeMenu(); }

// ═══════════════════════════════════════════
//  JEFF VOICE RINGS
// ═══════════════════════════════════════════
function startJeffVoiceRings() {
  stopJeffVoiceRings();
  var pzone = document.getElementById('pzone');
  function spawnRing() {
    var ring = document.createElement('div');
    ring.className = 'jeff-voice-ring';
    pzone.appendChild(ring);
    jeffRings.push(ring);
    setTimeout(function(){ ring.remove(); jeffRings=jeffRings.filter(function(r){return r!==ring;}); }, 1800);
  }
  spawnRing();
  jeffRingTimer = setInterval(spawnRing, 420);
}
function stopJeffVoiceRings() {
  if (jeffRingTimer) { clearInterval(jeffRingTimer); jeffRingTimer=null; }
  jeffRings.forEach(function(r){ if(r.parentNode) r.remove(); });
  jeffRings = [];
}

// ═══════════════════════════════════════════
//  RADIO WAVES — the secure comms channel
// ═══════════════════════════════════════════
var radioWaves = [];
var rwCtx = null;
// Portrait center y ≈ 44(status)+78(hdr)+8(pad)+96(half portrait) = ~226
// Orb center y ≈ 844-14(pad)-6(talk-label+pad)-80(half160orb) = ~744 → adjusted ~720
var RW_PORTRAIT_Y = 220;
var RW_ORB_Y      = 716;
var RW_CENTER_X   = 195;

function initRadioWaves() {
  var c = document.getElementById('radioWaveC');
  if (c) rwCtx = c.getContext('2d');
}

function spawnRadioWave(dir) {
  var startY = (dir === 'up') ? RW_ORB_Y      : RW_PORTRAIT_Y;
  var endY   = (dir === 'up') ? RW_PORTRAIT_Y : RW_ORB_Y;
  // Width: wider at orb end (wide base), narrower at portrait end
  var wAtOrb  = 110;
  var wAtPort = 38;
  radioWaves.push({
    dir: dir,
    startY: startY, endY: endY,
    wStart: (dir === 'up') ? wAtOrb  : wAtPort,
    wEnd:   (dir === 'up') ? wAtPort : wAtOrb,
    born: Date.now(),
    duration: 1100
  });
}

function startRadioWaves(dir) {
  stopRadioWaves();
  spawnRadioWave(dir);
  var interval = (dir === 'up') ? 360 : 300;
  radioWaveTimer = setInterval(function(){ spawnRadioWave(dir); }, interval);
}
function stopRadioWaves() {
  if (radioWaveTimer) { clearInterval(radioWaveTimer); radioWaveTimer=null; }
  radioWaves = [];
}

function drawRadioWaves() {
  if (!rwCtx) return;
  rwCtx.clearRect(0, 0, 390, 844);
  if (radioWaves.length === 0) return;
  var now = Date.now();
  var rgb = getModeRGB();
  // Use green for listening, mode color for speaking
  var useGreen = (talkState === 'listening');
  var r = useGreen ? 80  : rgb[0];
  var g = useGreen ? 210 : rgb[1];
  var b = useGreen ? 100 : rgb[2];
  var alive = [];
  for (var i = 0; i < radioWaves.length; i++) {
    var w = radioWaves[i];
    var elapsed = now - w.born;
    var p = elapsed / w.duration;
    if (p >= 1.0) continue;
    alive.push(w);
    var currentY = w.startY + (w.endY - w.startY) * p;
    var currentW = w.wStart + (w.wEnd - w.wStart) * p;
    // Sine-envelope fade: bright in middle of travel, fade at ends
    var fade = Math.sin(p * Math.PI);
    var alpha = 0.26 * fade;
    if (alpha < 0.01) continue;
    var hw = currentW / 2;
    var x1 = RW_CENTER_X - hw;
    var x2 = RW_CENTER_X + hw;
    // Curve direction: arcs bow toward destination
    var bowDir = (w.dir === 'up') ? -1 : 1;
    var bowAmount = hw * 0.55 * bowDir;
    // Draw 2 arc lines close together for thickness/glow feel
    for (var pass = 0; pass < 2; pass++) {
      var lw = pass === 0 ? 2.5 : 1.0;
      var la = pass === 0 ? alpha * 0.55 : alpha;
      rwCtx.beginPath();
      rwCtx.moveTo(x1, currentY);
      rwCtx.quadraticCurveTo(RW_CENTER_X, currentY + bowAmount, x2, currentY);
      rwCtx.strokeStyle = 'rgba(' + r + ',' + g + ',' + b + ',' + la + ')';
      rwCtx.lineWidth = lw;
      rwCtx.lineCap = 'round';
      rwCtx.stroke();
    }
  }
  radioWaves = alive;
}

// ═══════════════════════════════════════════
//  THE RESONANCE ORB
// ═══════════════════════════════════════════
var orbCtx = null;
function initOrb() {
  var c = document.getElementById('orbCanvas');
  if (c) orbCtx = c.getContext('2d');
}
function drawOrbCanvas() {
  if (!orbCtx) return;
  var W=160, H=160, cx=80, cy=80;
  orbCtx.clearRect(0,0,W,H);
  var now = Date.now();
  var rgb = getModeRGB();
  if (talkState === 'idle')          orbRotation += 0.0025;
  else if (talkState === 'thinking') orbRotation += 0.0008;
  else if (talkState === 'speaking') orbRotation -= 0.009;
  if (talkState === 'idle')          drawOrbMandala(orbCtx,cx,cy,now,rgb,0.65);
  else if (talkState === 'listening')drawOrbListening(orbCtx,cx,cy,now,[80,210,100]);
  else if (talkState === 'thinking') drawOrbThinking(orbCtx,cx,cy,now);
  else if (talkState === 'speaking') drawOrbSpeaking(orbCtx,cx,cy,now,rgb);
  drawOrbTacticalRing(orbCtx,cx,cy,rgb,orbRotation,talkState,now);
}
function drawOrbMandala(ctx,cx,cy,now,rgb,intensity){
  var t=now*0.0006, petals=6, baseR=20+Math.sin(t*0.4)*5;
  for(var p=0;p<petals;p++){
    var angle=(p/petals)*Math.PI*2+t*0.18;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(baseR*0.45,-baseR*0.28,baseR*0.88,baseR*0.08,baseR,0);
    ctx.bezierCurveTo(baseR*0.88,baseR*0.08,baseR*0.45,baseR*0.28,0,0);
    ctx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.10*intensity)+')';
    ctx.fill();ctx.restore();
  }
  var grd=ctx.createRadialGradient(cx,cy,0,cx,cy,baseR+6);
  grd.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.28*intensity)+')');
  grd.addColorStop(0.55,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.06*intensity)+')');
  grd.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
  ctx.beginPath();ctx.arc(cx,cy,baseR+6,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
}
function drawOrbListening(ctx,cx,cy,now,rgb){
  var t=now*0.0012, spread=0.65+0.35*Math.sin(t*1.4), petals=8, baseR=28*spread;
  for(var p=0;p<petals;p++){
    var angle=(p/petals)*Math.PI*2;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);
    ctx.beginPath();ctx.moveTo(0,0);
    ctx.bezierCurveTo(baseR*0.5,-baseR*0.3,baseR*0.88,baseR*0.1,baseR,0);
    ctx.bezierCurveTo(baseR*0.88,baseR*0.1,baseR*0.5,baseR*0.3,0,0);
    ctx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.20)';ctx.fill();ctx.restore();
  }
  var pulse=0.5+0.5*Math.sin(t*3.5);
  var grd=ctx.createRadialGradient(cx,cy,0,cx,cy,30);
  grd.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.40+pulse*0.22)+')');
  grd.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
  ctx.beginPath();ctx.arc(cx,cy,30,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
}
function drawOrbThinking(ctx,cx,cy,now){
  var t=now*0.001, r=16+Math.sin(t*1.8)*4;
  var grd=ctx.createRadialGradient(cx,cy,0,cx,cy,r+4);
  grd.addColorStop(0,'rgba(200,160,60,0.32)');grd.addColorStop(1,'rgba(200,160,60,0)');
  ctx.beginPath();ctx.arc(cx,cy,r+4,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
  for(var i=0;i<3;i++){
    var angle=t*2.2+(i/3)*Math.PI*2;
    var x=cx+Math.cos(angle)*22, y=cy+Math.sin(angle)*22;
    var a=i===0?0.72:i===1?0.44:0.22;
    ctx.beginPath();ctx.arc(x,y,i===0?3.5:2.5,0,Math.PI*2);
    ctx.fillStyle='rgba(200,160,60,'+a+')';ctx.fill();
  }
}
function drawOrbSpeaking(ctx,cx,cy,now,rgb){
  var t=now*0.001;
  for(var i=0;i<6;i++){
    var phase=((t*1.1+i*0.18)%1.0);
    var r=phase*47, alpha=Math.pow(1-phase,1.4)*0.58;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+alpha+')';
    ctx.lineWidth=2;ctx.stroke();
  }
  var burst=0.5+0.5*Math.sin(t*5);
  var grd=ctx.createRadialGradient(cx,cy,0,cx,cy,36);
  grd.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(0.46+burst*0.20)+')');
  grd.addColorStop(0.45,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.14)');
  grd.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
  ctx.beginPath();ctx.arc(cx,cy,36,0,Math.PI*2);ctx.fillStyle=grd;ctx.fill();
}
function drawOrbTacticalRing(ctx,cx,cy,rgb,rotation,state,now){
  var ringR=72;
  ctx.beginPath();ctx.arc(cx,cy,ringR,0,Math.PI*2);
  ctx.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.28)';ctx.lineWidth=1;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,ringR-4,0,Math.PI*2);
  ctx.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0.09)';ctx.lineWidth=0.5;ctx.stroke();
  for(var i=0;i<12;i++){
    var angle=rotation+(i/12)*Math.PI*2, major=(i%3===0);
    var inner=major?ringR-7:ringR-4;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(angle)*inner,cy+Math.sin(angle)*inner);
    ctx.lineTo(cx+Math.cos(angle)*ringR, cy+Math.sin(angle)*ringR);
    ctx.strokeStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+(major?0.65:0.28)+')';
    ctx.lineWidth=major?1.5:0.8;ctx.stroke();
    if(state==='listening'){
      var freq=Math.abs(Math.sin(now*0.007+i*0.55))*0.65+0.35;
      var dotR=ringR+9;
      ctx.beginPath();
      ctx.arc(cx+Math.cos(angle)*dotR,cy+Math.sin(angle)*dotR,freq*3.2,0,Math.PI*2);
      ctx.fillStyle='rgba(80,210,100,'+(freq*0.78)+')';ctx.fill();
    }
  }
}

// ═══════════════════════════════════════════
//  AMBIENT PARTICLE FIELD
// ═══════════════════════════════════════════
var particles=[], pCtx=null;
function initParticles(){
  var c=document.getElementById('particleField');
  if(!c) return;
  pCtx=c.getContext('2d');
  for(var i=0;i<38;i++){
    particles.push({x:Math.random()*390,y:Math.random()*844,vx:(Math.random()-0.5)*0.25,vy:-(Math.random()*0.35+0.08),size:Math.random()*1.6+0.3,alpha:Math.random()*0.10+0.03,life:Math.random()*Math.PI*2});
  }
}
function drawParticles(){
  if(!pCtx) return;
  pCtx.clearRect(0,0,390,844);
  var rgb=getModeRGB();
  for(var i=0;i<particles.length;i++){
    var p=particles[i];
    p.x+=p.vx+Math.sin(p.life*0.8)*0.18; p.y+=p.vy; p.life+=0.018;
    if(p.y<-5){p.y=849;p.x=Math.random()*390;}
    if(p.x<-5) p.x=395; if(p.x>395) p.x=-5;
    var a=p.alpha*(0.65+0.35*Math.sin(p.life*1.6));
    pCtx.beginPath();pCtx.arc(p.x,p.y,p.size,0,Math.PI*2);
    pCtx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+a+')';pCtx.fill();
  }
}

// ═══════════════════════════════════════════
//  MEMORY DOTS
// ═══════════════════════════════════════════
var memCtx=null, memTick=0;
function initMemDots(){
  var c=document.getElementById('memC');
  if(c) memCtx=c.getContext('2d');
}
function drawMemDots(){
  if(!memCtx) return;
  memCtx.clearRect(0,0,260,260);
  var rgb=getModeRGB(), cx=130,cy=130,radius=108,dots=5;
  var arcStart=Math.PI*0.72, arcEnd=Math.PI*2.28;
  for(var i=0;i<dots;i++){
    var t=i/(dots-1), angle=arcStart+(arcEnd-arcStart)*t;
    var x=cx+Math.cos(angle)*radius, y=cy+Math.sin(angle)*radius;
    var pulse=Math.sin(memTick*0.018+i*0.8)*0.35+0.65;
    var r=3.2*pulse, alpha=0.55*pulse;
    memCtx.beginPath();memCtx.arc(x,y,r,0,Math.PI*2);
    memCtx.fillStyle='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+','+alpha+')';
    memCtx.shadowColor='rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',.7)';
    memCtx.shadowBlur=6*pulse;memCtx.fill();memCtx.shadowBlur=0;
  }
  memTick++;
}

// ═══════════════════════════════════════════
//  TERRAIN CANVAS — drawn once at init
// ═══════════════════════════════════════════
function initTerrain(){
  var c=document.getElementById('terrainC');
  if(!c) return;
  var ctx=c.getContext('2d');
  // Draw 10 irregular topographic contour ellipses
  var contours=[
    {cx:130,cy:200,rx:180,ry:90,rot:-0.2},
    {cx:280,cy:420,rx:140,ry:70,rot:0.15},
    {cx:60, cy:600,rx:160,ry:80,rot:0.08},
    {cx:320,cy:680,rx:110,ry:55,rot:-0.1},
    {cx:195,cy:350,rx:200,ry:100,rot:0.05},
    {cx:100,cy:150,rx:120,ry:60,rot:0.30},
    {cx:350,cy:300,rx:90, ry:45,rot:-0.25},
    {cx:200,cy:720,rx:170,ry:85,rot:0.12},
    {cx:50, cy:450,rx:100,ry:50,rot:-0.05},
    {cx:340,cy:550,rx:130,ry:65,rot:0.20}
  ];
  ctx.strokeStyle='rgba(180,155,100,0.045)';
  ctx.lineWidth=0.7;
  for(var i=0;i<contours.length;i++){
    var co=contours[i];
    ctx.save();
    ctx.translate(co.cx,co.cy);
    ctx.rotate(co.rot);
    ctx.beginPath();
    ctx.ellipse(0,0,co.rx,co.ry,0,0,Math.PI*2);
    ctx.stroke();
    // inner ring ~70% size
    ctx.beginPath();
    ctx.ellipse(0,0,co.rx*0.68,co.ry*0.68,0,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
}

// ═══════════════════════════════════════════
//  MAIN ANIMATION LOOP
// ═══════════════════════════════════════════
function mainLoop(){
  drawParticles();
  drawMemDots();
  drawOrbCanvas();
  drawRadioWaves();
  requestAnimationFrame(mainLoop);
}

// ═══════════════════════════════════════════
//  BG ELEMENT INIT
// ═══════════════════════════════════════════
function initStars(){
  var c=document.getElementById('bgStars');
  if(!c) return;
  for(var i=0;i<55;i++){
    var d=document.createElement('div');d.className='star-dot';
    d.style.left=Math.random()*100+'%';d.style.top=Math.random()*100+'%';
    var sz=Math.random()*1.8+0.4;d.style.width=sz+'px';d.style.height=sz+'px';
    d.style.setProperty('--tdur',(Math.random()*4+2)+'s');
    d.style.setProperty('--tdelay',(Math.random()*4)+'s');
    d.style.setProperty('--tmin',(Math.random()*0.1+0.05).toFixed(2));
    d.style.setProperty('--tmax',(Math.random()*0.5+0.3).toFixed(2));
    c.appendChild(d);
  }
}
function initGlassMap(){
  var W=390,H=844,cv=document.createElement('canvas');
  cv.width=W;cv.height=H;
  var ctx=cv.getContext('2d'),img=ctx.createImageData(W,H),d=img.data,BW=0.16;
  for(var py=0;py<H;py++){
    for(var px=0;px<W;px++){
      var ex=1-Math.min(px/(W*BW),(W-px)/(W*BW),1);
      var ey=1-Math.min(py/(H*BW),(H-py)/(H*BW),1);
      var ef=Math.min(Math.sqrt(ex*ex+ey*ey),1);
      var sq=Math.pow(ef,0.62);
      var nx=(px/W)*2-1,ny=(py/H)*2-1;
      var len=Math.sqrt(nx*nx+ny*ny)||0.001;
      var dx=-nx/len*sq,dy=-ny/len*sq;
      var idx=(py*W+px)*4;
      d[idx]=Math.round(128+dx*72);d[idx+1]=Math.round(128+dy*72);
      d[idx+2]=128;d[idx+3]=255;
    }
  }
  ctx.putImageData(img,0,0);
  var fe=document.getElementById('fe-disp-map');
  if(fe) fe.setAttribute('href',cv.toDataURL('image/png'));
}

// ═══════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════
initGlassMap();
initOrb();
initMemDots();
initParticles();
initRadioWaves();
initStars();
initTerrain();
requestAnimationFrame(mainLoop);
</script>
